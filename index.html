<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفترچه گرامر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16211c;
    --panel: #1d2b23;
    --panel-alt: #24352c;
    --border: #3a4c40;
    --border-soft: #2c3d33;
    --text: #ece7d9;
    --text-muted: #a7b6ac;
    --text-faint: #758077;
    --accent: #e7b740;
    --accent-soft: #4a4327;
    --accent-2: #8bb59a;
    --danger: #e2725b;
    --danger-soft: #402c26;
    --success: #8fbf8a;
    --success-soft: #26382a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% 0%, #1b2a22 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
  }
  .en{ font-family:'Space Grotesk', sans-serif; direction:ltr; unicode-bidi:isolate; }
  .disp{ font-family:'Fraunces', serif; direction:ltr; unicode-bidi:isolate; }

  ::selection{ background:var(--accent-soft); }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:18px 28px;
    border-bottom:1px solid var(--border-soft);
    position:sticky; top:0; z-index:20;
    background:rgba(22,33,28,0.92);
    backdrop-filter: blur(6px);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .chalk-mark{
    width:10px; height:10px; border-radius:2px; background:var(--accent);
    transform:rotate(8deg);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .brand h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:.2px;}
  .brand span.sub{ font-size:12px; color:var(--text-faint); font-family:'Space Grotesk',sans-serif; direction:ltr;}
  nav.tabs{ display:flex; gap:6px; }
  nav.tabs button{
    background:transparent; border:1px solid var(--border);
    color:var(--text-muted); padding:8px 16px; border-radius:8px;
    font-family:inherit; font-size:14px; cursor:pointer;
    transition:.15s ease;
  }
  nav.tabs button:hover{ border-color:var(--accent-2); color:var(--text); }
  nav.tabs button.active{ background:var(--panel-alt); border-color:var(--accent); color:var(--accent); }

  /* ---------- Layout ---------- */
  .layout{ display:flex; max-width:1280px; margin:0 auto; min-height:calc(100vh - 68px); }
  aside{
    width:270px; flex-shrink:0;
    border-left:1px solid var(--border-soft);
    padding:22px 16px; height:calc(100vh - 68px); overflow-y:auto;
    position:sticky; top:68px;
  }
  aside::-webkit-scrollbar{ width:6px; }
  aside::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  .cat{ margin-bottom:6px; }
  .cat-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 10px; cursor:pointer; border-radius:8px;
    color:var(--text); font-size:14.5px; font-weight:600;
  }
  .cat-head:hover{ background:var(--panel); }
  .cat-head .arrow{ color:var(--text-faint); font-size:11px; transition:transform .15s; }
  .cat.open .arrow{ transform:rotate(90deg); }
  .cat-list{ display:none; padding:2px 6px 10px 6px; }
  .cat.open .cat-list{ display:block; }
  .topic-btn{
    display:block; width:100%; text-align:right; background:none; border:none;
    color:var(--text-muted); font-family:inherit; font-size:13.5px;
    padding:8px 10px; border-radius:7px; cursor:pointer; line-height:1.5;
  }
  .topic-btn:hover{ background:var(--panel); color:var(--text); }
  .topic-btn.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .topic-btn .en{ display:block; font-size:11.5px; color:var(--text-faint); }
  .topic-btn.active .en{ color:var(--accent); opacity:.75; }
  .topic-btn{ position:relative; padding-left:26px; }
  .topic-btn .done-mark{
    position:absolute; left:8px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; border-radius:50%; background:var(--success-soft);
    color:var(--success); font-size:10px; display:none; align-items:center; justify-content:center;
  }
  .topic-btn.done .done-mark{ display:flex; }

  .sidebar-search{
    width:100%; background:var(--panel); border:1px solid var(--border-soft); color:var(--text);
    border-radius:9px; padding:9px 12px; font-family:inherit; font-size:13px; margin-bottom:14px;
  }
  .sidebar-search:focus{ outline:none; border-color:var(--accent); }
  .sidebar-search::placeholder{ color:var(--text-faint); }
  .cat.hidden-by-search, .topic-btn.hidden-by-search{ display:none !important; }

  main{ flex:1; padding:32px 40px; min-width:0; }

  /* ---------- Topic view ---------- */
  .topic-header{ margin-bottom:22px; }
  .topic-header .level{
    display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px;
    border:1px solid var(--border); color:var(--text-faint); margin-bottom:12px;
    font-family:'Space Grotesk',sans-serif;
  }
  .topic-header h2{ font-size:30px; margin:0 0 4px 0; font-family:'Fraunces',serif; font-weight:600; direction:ltr; text-align:right; }
  .topic-header .fa-title{ font-size:16px; color:var(--text-muted); font-weight:500; }

  .card{
    background:var(--panel); border:1px solid var(--border-soft);
    border-radius:14px; padding:24px; margin-bottom:20px;
  }
  .card h3{ margin:0 0 14px 0; font-size:15px; color:var(--accent-2); font-weight:700; }
  .formula{
    font-family:'Space Grotesk',sans-serif; direction:ltr; text-align:center;
    background:var(--panel-alt); border:1px dashed var(--border); border-radius:10px;
    padding:16px; font-size:17px; color:var(--accent); margin-bottom:16px; letter-spacing:.3px;
  }
  .explain{ line-height:2.1; font-size:15px; color:var(--text); margin:0; }

  .examples{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px; }
  .examples li{ border-bottom:1px dashed var(--border-soft); padding-bottom:12px; }
  .examples li:last-child{ border-bottom:none; padding-bottom:0; }
  .examples .en-ex{ font-family:'Space Grotesk',sans-serif; direction:ltr; text-align:left; font-size:15.5px; color:var(--text); }
  .examples .fa-ex{ font-size:13.5px; color:var(--text-muted); margin-top:3px; }

  .video-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:6px;
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    text-decoration:none; padding:10px 16px; border-radius:9px; font-size:13.5px;
    transition:.15s;
  }
  .video-link:hover{ border-color:var(--danger); color:var(--danger); }

  textarea, input[type=text]{
    width:100%; background:var(--panel-alt); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:14px; font-family:'Space Grotesk',sans-serif;
    direction:ltr; text-align:left; font-size:14.5px; resize:vertical;
  }
  textarea:focus, input:focus{ outline:none; border-color:var(--accent); }
  .row-btn{ display:flex; justify-content:flex-end; margin-top:10px; }
  button.primary{
    background:var(--accent); border:none; color:#1b1607; font-weight:700;
    padding:10px 22px; border-radius:9px; font-family:inherit; font-size:14px; cursor:pointer;
    transition:.15s;
  }
  button.primary:hover{ filter:brightness(1.08); }
  button.primary:disabled{ opacity:.55; cursor:progress; }

  .result-box{
    margin-top:14px; padding:14px 16px; border-radius:10px; font-size:14.5px; line-height:2;
    display:none; white-space:pre-wrap;
  }
  .result-box.show{ display:block; }
  .result-box.ok{ background:var(--success-soft); border:1px solid var(--success); color:var(--success); }
  .result-box.bad{ background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); }
  .result-box.neutral{ background:var(--panel-alt); border:1px solid var(--border); color:var(--text); }

  /* quiz */
  .quiz-q{ margin-bottom:18px; }
  .quiz-q p.q-text{ font-size:14.5px; margin:0 0 10px 0; }
  .quiz-q .opts{ display:flex; flex-direction:column; gap:8px; }
  .quiz-opt{
    display:block; text-align:right; width:100%; background:var(--panel-alt);
    border:1px solid var(--border); color:var(--text); padding:10px 14px;
    border-radius:8px; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-size:13.5px;
    direction:ltr; text-align:left;
  }
  .quiz-opt:hover{ border-color:var(--accent-2); }
  .quiz-opt.correct{ background:var(--success-soft); border-color:var(--success); }
  .quiz-opt.wrong{ background:var(--danger-soft); border-color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-exp{ font-size:13px; color:var(--text-muted); margin-top:8px; display:none; }
  .quiz-exp.show{ display:block; }

  /* analyzer tab */
  .analyzer-wrap{ max-width:760px; }
  .analyzer-wrap h2{ font-family:'Fraunces',serif; font-size:26px; margin:0 0 6px 0; }
  .analyzer-wrap p.hint{ color:var(--text-muted); font-size:14px; margin:0 0 18px 0; line-height:1.9; }

  .welcome{ max-width:640px; }
  .welcome h2{ font-family:'Vazirmatn', sans-serif; font-size:32px; margin:0 0 10px 0; }
  .welcome p{ color:var(--text-muted); line-height:2; font-size:15px; }

  /* ---------- Learning Path ---------- */
  .path-wrap{ max-width:920px; }
  .path-wrap h2{ font-family:'Fraunces',serif; font-size:28px; margin:0 0 6px 0; }
  .path-wrap p.hint{ color:var(--text-muted); font-size:14px; margin:0 0 22px 0; line-height:1.9; }

  .overall-progress{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:14px;
    padding:20px 22px; margin-bottom:26px;
  }
  .overall-progress .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .overall-progress .row strong{ font-size:15px; color:var(--text); }
  .overall-progress .row span{ font-size:13px; color:var(--accent); font-family:'Space Grotesk',sans-serif; direction:ltr; }
  .progress-track{ width:100%; height:9px; border-radius:6px; background:var(--panel-alt); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius:6px; transition:width .4s ease; }

  .level-block{ margin-bottom:28px; }
  .level-block-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .level-badge{
    font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#1b1607;
    background:var(--accent); padding:4px 12px; border-radius:20px;
  }
  .level-block-head h3{ margin:0; font-size:16px; color:var(--text); font-weight:700; }
  .level-block-head .mini-progress{ margin-right:auto; font-size:12px; color:var(--text-faint); font-family:'Space Grotesk',sans-serif; direction:ltr; }

  .path-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px; }
  .path-card{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:12px;
    padding:14px 16px; cursor:pointer; transition:.15s; position:relative;
  }
  .path-card:hover{ border-color:var(--accent-2); transform:translateY(-2px); }
  .path-card.done{ border-color:var(--success); background:var(--success-soft); }
  .path-card .step-no{
    font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--text-faint);
    display:flex; align-items:center; gap:6px; margin-bottom:6px;
  }
  .path-card.done .step-no{ color:var(--success); }
  .path-card .en{ font-family:'Space Grotesk',sans-serif; font-size:14.5px; color:var(--text); direction:ltr; text-align:left; display:block; }
  .path-card .fa{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .path-card .check-icon{
    position:absolute; top:12px; left:12px; width:20px; height:20px; border-radius:50%;
    background:var(--success); color:#0e1a13; font-size:12px; display:none; align-items:center; justify-content:center;
  }
  .path-card.done .check-icon{ display:flex; }

  .level-complete-banner{
    margin-top:10px; padding:10px 14px; border-radius:9px; background:var(--success-soft);
    border:1px solid var(--success); color:var(--success); font-size:13px; display:none;
  }
  .level-block.all-done .level-complete-banner{ display:block; }

  .mark-learned-btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--panel-alt); border:1px solid var(--border);
    color:var(--text); padding:10px 18px; border-radius:9px; font-family:inherit; font-size:13.5px; cursor:pointer;
    transition:.15s;
  }
  .mark-learned-btn:hover{ border-color:var(--success); color:var(--success); }
  .mark-learned-btn.is-done{ background:var(--success-soft); border-color:var(--success); color:var(--success); }

  .usage-list{ margin:0; padding-right:20px; display:flex; flex-direction:column; gap:10px; }
  .usage-list li{ font-size:14.5px; line-height:1.9; color:var(--text); }
  .usage-list li .en, .usage-list li{ direction:rtl; }

  .mistake-card{ border-color:var(--danger); background:var(--danger-soft); }
  .mistake-card h3{ color:var(--danger); }
  .mistake-card .explain{ color:var(--text); }

  .mobile-back{
    display:none; align-items:center; gap:6px; margin-bottom:18px;
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:9px; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .mobile-back:hover{ border-color:var(--accent); color:var(--accent); }

  @media (max-width: 860px){
    .layout{ flex-direction:column; }
    aside{ width:100%; height:auto; position:relative; top:0; border-left:none; border-bottom:1px solid var(--border-soft); }
    main{ padding:24px 18px; }

    body.mobile-detail aside{ display:none; }
    body.mobile-detail .layout{ display:block; }
    body.mobile-detail main{ padding-top:18px; }
    body.mobile-detail .mobile-back{ display:inline-flex; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="chalk-mark"></span>
    <h1>دفترچه گرامر</h1>
    <span class="sub">English Grammar Notebook</span>
  </div>
  <nav class="tabs">
    <button id="tab-topics" class="active">گرامرها</button>
    <button id="tab-path">مسیر یادگیری</button>
    <button id="tab-analyzer">تحلیلگر جمله</button>
  </nav>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
/* ============ DATA ============ */
const GRAMMAR = [
  { cat: "زمان‌ها (Tenses)", topics: [
    { id:"pres-simple", en:"Present Simple", fa:"حال ساده", level:"A1",
      formula:"S + V(base)/V(-s)  ...  Do/Does + S + V(base)?  ...  S + don't/doesn't + V(base)",
      explain:"حال ساده برای کارهایی به کار می‌رود که تکرار می‌شوند، عادت هستند، یا همیشه درست‌اند — نه لزوماً کاری که همین الان در حال انجام است. مثلاً «I work in a bank» یعنی شغل من اینه، نه اینکه الان دارم کار می‌کنم. با فاعل سوم‌شخص مفرد (he/she/it) فعل «s» یا «es» می‌گیرد؛ اگر فعل به consonant+y ختم شود، «y» به «ies» تبدیل می‌شود (study→studies).",
      usage:[
        "برای عادت‌ها و روتین‌های روزمره: I get up at 7 every day.",
        "برای حقایق و قوانین همیشگی: The Earth goes around the Sun.",
        "برای برنامه‌های ثابت (مثل جدول زمانی): The train leaves at 9pm.",
        "با قیدهای تکرار مثل always, usually, often, sometimes, never, every day.",
        "برای احساسات و افکار پایدار: I like coffee. She believes in hard work."
      ],
      mistake:"اشتباه رایج: استفاده از حال ساده برای کاری که همین الان در حال انجام است. درست نیست: «I read a book now» — باید بگی «I am reading a book now» (حال استمراری).",
      examples:[["She works in a bank.","او در یک بانک کار می‌کند."],["The sun rises in the east.","خورشید از شرق طلوع می‌کند."],["I don't drink coffee.","من قهوه نمی‌خورم."],["He studies English every evening.","او هر عصر انگلیسی می‌خواند."]],
      yt:"present simple tense explained" },
    { id:"pres-cont", en:"Present Continuous", fa:"حال استمراری", level:"A1",
      formula:"S + am/is/are + V-ing  ...  Am/Is/Are + S + V-ing?  ...  S + am/is/are + not + V-ing",
      explain:"حال استمراری برای کاری استفاده می‌شود که همین الان، در همین لحظه، در حال اتفاق افتادن است، یا برای یک روند موقتی در دوره‌ی زمانی فعلی (نه لزوماً همین ثانیه). همچنین برای برنامه‌های از قبل تنظیم‌شده در آینده‌ی نزدیک به کار می‌رود. توجه: بعضی از فعل‌ها (مثل know, like, want, believe, need, seem, own) معمولاً در حالت استمراری استفاده نمی‌شوند چون حالت‌های ذهنی یا دائمی را نشان می‌دهند.",
      usage:[
        "کاری که همین الان در حال انجام است: She is cooking dinner right now.",
        "روندی موقتی که این روزها در جریان است: I'm studying English this month.",
        "برنامه‌ی قطعی در آینده‌ی نزدیک: We are flying to Rome on Friday.",
        "با قیدهایی مثل now, right now, at the moment, these days, currently.",
        "برای شکایت از یک عادت آزاردهنده با always: He is always losing his keys!"
      ],
      mistake:"اشتباه رایج: به‌کار بردن افعال حالتی (state verbs) مثل know, want, love در حالت استمراری. درست نیست: «I am knowing the answer» — باید بگی «I know the answer».",
      examples:[["I am reading a book now.","الان دارم کتاب می‌خوانم."],["They are meeting us tomorrow.","آن‌ها فردا با ما ملاقات می‌کنند."],["She isn't listening to me.","او به من گوش نمی‌دهد."]],
      yt:"present continuous tense explained" },
    { id:"past-simple", en:"Past Simple", fa:"گذشته ساده", level:"A1",
      formula:"S + V(past)  ...  Did + S + V(base)?  ...  S + didn't + V(base)",
      explain:"گذشته ساده برای کاری استفاده می‌شود که در یک زمان مشخص در گذشته شروع و تمام شده و هیچ ارتباطی به حال ندارد. افعال باقاعده «ed» می‌گیرند (با قوانین املایی: play→played، study→studied، stop→stopped) و افعال بی‌قاعده شکل خاص خودشان را دارند که باید حفظ شوند (go→went، see→saw). در جمله‌ی سؤالی و منفی، فعل به شکل ساده (base) برمی‌گردد و «did/didn't» زمان را نشان می‌دهد.",
      usage:[
        "کاری که در گذشته تمام شده: I visited Rome in 2019.",
        "همراه با زمان مشخص گذشته: yesterday, last week, two years ago, in 2020.",
        "توالی کارهای گذشته در یک داستان: He woke up, had breakfast, and left.",
        "در جملات منفی و سؤالی، فعل اصلی به شکل ساده برمی‌گردد: Did she call you? / She didn't call.",
        "عادت‌های گذشته که دیگر ادامه ندارند (می‌توان به‌جایش از used to هم استفاده کرد): I played tennis a lot as a child."
      ],
      mistake:"اشتباه رایج: در جمله‌ی منفی و سؤالی هم فعل رو به گذشته می‌برند. درست نیست: «Did she went?» — باید بگی «Did she go?» چون «did» خودش زمان گذشته را نشان می‌دهد.",
      examples:[["We visited Paris last year.","سال گذشته از پاریس بازدید کردیم."],["She didn't call me.","او به من زنگ نزد."],["Did you see that movie?","آن فیلم را دیدی؟"]],
      yt:"past simple tense explained" },
    { id:"past-cont", en:"Past Continuous", fa:"گذشته استمراری", level:"A2",
      formula:"S + was/were + V-ing  ...  Was/Were + S + V-ing?  ...  S + wasn't/weren't + V-ing",

/* ============ LEARNING PATH ============ */
const LEARNING_PATH = [
  { level:"A1", label:"پایه (A1) — شروع کار", ids:["pres-simple","articles","prep-place","prep-time","modal-can"] },
  { level:"A2", label:"مقدماتی (A2) — گسترش زمان‌ها", ids:["pres-cont","past-simple","past-cont","comparative","modal-must","modal-should","future","pres-perfect","cond-zero","cond-first"] },
  { level:"B1", label:"متوسط (B1) — ساختارهای پیچیده‌تر", ids:["past-perfect","passive","reported","relative","gerund-inf","cond-second"] },
  { level:"B2", label:"پیشرفته (B2) — تسلط کامل", ids:["cond-third"] },
];

/* ============ STATE ============ */
let currentTopicId = null;
let currentTab = "topics";
let sidebarQuery = "";
const completedTopics = new Set();

/* ============ HELPERS ============ */
function findTopic(id){
  for(const cat of GRAMMAR){
    const t = cat.topics.find(t=>t.id===id);
    if(t) return t;
  }
  return null;
}
function ytLink(query){
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
}
function totalTopicCount(){
  return GRAMMAR.reduce((sum,cat)=>sum+cat.topics.length, 0);
}
function toggleTopicDone(id){
  if(completedTopics.has(id)) completedTopics.delete(id);
  else completedTopics.add(id);
  syncSidebarDoneMarks();
}
function syncSidebarDoneMarks(){
  document.querySelectorAll(".topic-btn").forEach(btn=>{
    btn.classList.toggle("done", completedTopics.has(btn.dataset.id));
  });
}

/* ============ SIDEBAR ============ */
function renderSidebar(){
  const el = document.getElementById("sidebar");
  el.innerHTML = `<input type="text" class="sidebar-search" id="sidebar-search" placeholder="جستجوی گرامر... (مثلاً passive یا مجهول)">`;
  GRAMMAR.forEach((cat, ci)=>{
    const wrap = document.createElement("div");
    wrap.className = "cat" + (ci===0 ? " open":"");
    wrap.innerHTML = `
      <div class="cat-head">
        <span>${cat.cat}</span>
        <span class="arrow">▸</span>
      </div>
      <div class="cat-list">
        ${cat.topics.map(t=>`
          <button class="topic-btn${completedTopics.has(t.id)?' done':''}" data-id="${t.id}" data-search="${(t.en+' '+t.fa).toLowerCase()}">
            <span class="done-mark">✓</span>
            <span class="en">${t.en}</span>${t.fa}
          </button>`).join("")}
      </div>
    `;
    wrap.querySelector(".cat-head").addEventListener("click", ()=>{
      wrap.classList.toggle("open");
    });
    el.appendChild(wrap);
  });
  el.querySelectorAll(".topic-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentTopicId = btn.dataset.id;
      setTab("topics");
      renderAll();
    });
  });
  document.getElementById("sidebar-search").addEventListener("input", (e)=>{
    filterSidebar(e.target.value.trim().toLowerCase());
  });
}
function filterSidebar(query){
  const cats = document.querySelectorAll("#sidebar .cat");
  cats.forEach(catEl=>{
    const btns = catEl.querySelectorAll(".topic-btn");
    let anyVisible = false;
    btns.forEach(btn=>{
      const match = !query || btn.dataset.search.includes(query);
      btn.classList.toggle("hidden-by-search", !match);
      if(match) anyVisible = true;
    });
    catEl.classList.toggle("hidden-by-search", !anyVisible);
    if(query && anyVisible) catEl.classList.add("open");
  });
}

  document.getElementById("mark-learned-btn").addEventListener("click", ()=>{

      currentTopicId = prevTopic.id; renderAll();

  }
  if(nextTopic){
    document.getElementById("path-next-btn").addEventListener("click", ()=>{
      currentTopicId = nextTopic.id; renderAll();
    });

  document.getElementById("mobile-back-btn").addEventListener("click", ()=>{
    currentTopicId = null;
    renderAll();
  });

  document.getElementById("check-own").addEventListener("click", ()=>{

      box.textContent = "اول یه جمله بنویس.";
      return;
    }
    const results = analyzeLocally(val);
    const matchKeys = TOPIC_MATCH[t.id] || [];
    const hit = results.find(r => matchKeys.some(k => r.label.includes(k)));

    if(hit){
      box.className = "result-box show ok";
      box.textContent = `درسته! این جمله «${t.en}» رو به‌کار برده (تشخیص داده‌شده: ${hit.label} → «${hit.quote}»).`;

      box.className = "result-box show bad";
      box.textContent = `به نظر می‌رسه این جمله «${t.en}» رو نشون نمی‌ده. ساختارهایی که توش پیدا کردم: ${results.map(r=>r.label).join("، ")}. دوباره با فرمول «${t.formula}» امتحان کن.`;
    } else {
      box.className = "result-box show bad";
      box.textContent = `نتونستم ساختار «${t.en}» رو توی این جمله تشخیص بدم. سعی کن دقیقاً از فرمول «${t.formula}» استفاده کنی.`;
    }
  });

  const quizArea = document.getElementById("quiz-area");
  if(quiz.length === 0){
    quizArea.innerHTML = `<p class="explain">فعلاً کوییزی برای این بخش نداریم.</p>`;
  } else {
    quizArea.innerHTML = quiz.map((q, qi)=>`
      <div class="quiz-q">
        <p class="q-text en">${qi+1}. ${q.q}</p>
        <div class="opts" data-qi="${qi}">
          ${q.opts.map((o,oi)=>`<button class="quiz-opt en" data-oi="${oi}">${o}</button>`).join("")}
        </div>
        <div class="quiz-exp" id="quiz-exp-${qi}">${q.exp}</div>
      </div>
    `).join("");

    quiz.forEach((q, qi)=>{
      const group = quizArea.querySelector(`.opts[data-qi="${qi}"]`);
      group.querySelectorAll(".quiz-opt").forEach(optBtn=>{
        optBtn.addEventListener("click", ()=>{
          const chosen = Number(optBtn.dataset.oi);
          group.querySelectorAll(".quiz-opt").forEach((b,i)=>{
            b.disabled = true;
            if(i === q.a) b.classList.add("correct");
            else if(i === chosen) b.classList.add("wrong");
          });
          document.getElementById(`quiz-exp-${qi}`).classList.add("show");
        });
      });
    });
  }
}

/* ============ LOCAL RULE-BASED GRAMMAR ANALYZER (no AI) ============ */
const IRREGULAR = {
  "be":["was","been"],"begin":["began","begun"],"break":["broke","broken"],"bring":["brought","brought"],
  "build":["built","built"],"buy":["bought","bought"],"catch":["caught","caught"],"choose":["chose","chosen"],
  "come":["came","come"],"cut":["cut","cut"],"do":["did","done"],"draw":["drew","drawn"],"drink":["drank","drunk"],
  "drive":["drove","driven"],"eat":["ate","eaten"],"fall":["fell","fallen"],"feel":["felt","felt"],
  "find":["found","found"],"fly":["flew","flown"],"forget":["forgot","forgotten"],"get":["got","gotten"],
  "give":["gave","given"],"go":["went","gone"],"grow":["grew","grown"],"have":["had","had"],"hear":["heard","heard"],
  "hide":["hid","hidden"],"hold":["held","held"],"keep":["kept","kept"],"know":["knew","known"],"leave":["left","left"],
  "lose":["lost","lost"],"make":["made","made"],"mean":["meant","meant"],"meet":["met","met"],"pay":["paid","paid"],
  "put":["put","put"],"read":["read","read"],"ride":["rode","ridden"],"ring":["rang","rung"],"rise":["rose","risen"],
  "run":["ran","run"],"say":["said","said"],"see":["saw","seen"],"sell":["sold","sold"],"send":["sent","sent"],
  "sing":["sang","sung"],"sit":["sat","sat"],"sleep":["slept","slept"],"speak":["spoke","spoken"],"spend":["spent","spent"],
  "stand":["stood","stood"],"steal":["stole","stolen"],"swim":["swam","swum"],"take":["took","taken"],"teach":["taught","taught"],
  "tell":["told","told"],"think":["thought","thought"],"throw":["threw","thrown"],"understand":["understood","understood"],
  "wake":["woke","woken"],"wear":["wore","worn"],"win":["won","won"],"write":["wrote","written"],"become":["became","become"]
};
const IRREGULAR_PAST = new Set(Object.values(IRREGULAR).map(v=>v[0]));
const IRREGULAR_PP = new Set(Object.values(IRREGULAR).map(v=>v[1]));
const BE = new Set(["am","is","are","was","were","be","been","being"]);
const HAVE = new Set(["have","has","had"]);
const MODALS = new Set(["can","could","must","should","might","may","shall","ought","would"]);
const TIME_WORDS = new Set(["morning","afternoon","evening","night","monday","tuesday","wednesday","thursday","friday","saturday","sunday",
  "mondays","tuesdays","wednesdays","thursdays","fridays","saturdays","sundays","weekend","weekends","weekday","weekdays",
  "mornings","afternoons","evenings","nights",
  "january","february","march","april","may","june","july","august","september","october","november","december","o'clock","noon","midnight"]);
const COMPARATIVES = new Set(["better","worse","bigger","smaller","faster","slower","taller","shorter","higher","lower","older","younger","longer","cheaper","nicer","stronger","weaker","richer","poorer","closer","larger"]);
const SUPERLATIVES = new Set(["best","worst","biggest","smallest","fastest","slowest","tallest","shortest","highest","lowest","oldest","youngest","longest","cheapest","nicest","strongest","weakest","richest","poorest","closest","largest"]);
const GERUND_TRIGGERS = new Set(["enjoy","like","love","hate","avoid","finish","suggest","mind","keep","practice","consider","miss","quit","deny","imagine","stop","start","continue"]);

const TOPIC_MATCH = {
  "pres-simple": ["حال ساده"],
  "pres-cont": ["حال استمراری"],
  "past-simple": ["گذشته ساده"],
  "past-cont": ["گذشته استمراری"],
  "pres-perfect": ["حال کامل"],
  "past-perfect": ["گذشته کامل"],
  "future": ["زمان آینده"],
  "cond-zero": ["شرطی نوع صفر"],
  "cond-first": ["شرطی نوع اول"],
  "cond-second": ["شرطی نوع دوم"],
  "cond-third": ["شرطی نوع سوم"],
  "passive": ["جمله مجهول"],
  "modal-can": ["Modal: can","Modal: could"],
  "modal-must": ["Modal: must","have to"],
  "modal-should": ["Modal: should"],
  "reported": ["نقل قول غیرمستقیم"],
  "relative": ["جمله موصولی"],
  "articles": ["حروف تعریف"],
  "prep-time": ["حرف اضافه‌ی زمان"],
  "prep-place": ["حرف اضافه‌ی مکان"],
  "comparative": ["صفت تفضیلی","صفت عالی"],
  "gerund-inf": ["اسم مصدر","مصدر با to"],
};

function isPastForm(w){ return (w.endsWith("ed") && !EXCLUDE_ED_WORDS.has(w)) || IRREGULAR_PAST.has(w); }
function isPPForm(w){ return (w.endsWith("ed") && !EXCLUDE_ED_WORDS.has(w)) || IRREGULAR_PP.has(w); }

/* words that end in the letters "ed" but are NOT a past-tense/past-participle main verb in
   normal usage — -ed feeling-adjectives (tired, bored...) and base-form verbs that merely
   happen to end in "ed" (need, speed...). Skipping these avoids a lot of false "passive"/"past" tags. */
const EXCLUDE_ED_WORDS = new Set([
  "tired","bored","interested","excited","confused","relaxed","worried","annoyed","scared","embarrassed",
  "surprised","pleased","satisfied","disappointed","frightened","shocked","amazed","concerned","stressed",
  "depressed","married","talented","gifted","skilled","crowded","complicated","detailed","limited","advanced",
  "need","speed","feed","breed","exceed","proceed","succeed","indeed","seed","weed","bleed","embed"
]);

const COMMON_VERBS = new Set(["be","go","do","make","have","get","take","give","help","study","play","eat","write","read",
  "watch","listen","work","live","buy","sell","travel","visit","meet","call","ask","answer","open","close","start","stop",
  "finish","decide","want","need","like","love","hope","plan","try","forget","remember","promise","agree","refuse","learn",
  "speak","talk","walk","run","swim","drive","fly","cook","clean","wash","sleep","wake","stay","leave","arrive","understand",
  "know","think","believe","feel","see","hear","bring","send","teach","show","tell","find","lose","win","build","break",
  "fix","paint","draw","sing","dance","enjoy","cost","use","move","turn","wait","join","offer","carry","pay","follow"]);
const NON_ADJ_ER = new Set(["after","under","over","number","water","summer","winter","other","another","together","however",
  "whether","neither","either","mother","father","brother","sister","weather","letter","matter","computer","paper","order",
  "power","answer","never","ever","enter","center","finger","dinner","corner","teacher","doctor","driver","player","worker",
  "manager","member","partner","customer","river","offer","proper","chapter","master","monster","tiger","cover"]);
const NON_ADJ_EST = new Set(["guest","forest","honest","interest","rest","test","west","chest","protest","request","suggest"]);

/* Expand common contractions so the analyzer can "see" negatives and short forms
   (isn't -> is not, I'm -> I am, etc.) — this alone catches a lot of real sentences. */
const CONTRACTIONS = [
  [/\bwon't\b/gi, "will not"], [/\bcan't\b/gi, "can not"], [/\bshan't\b/gi, "shall not"],
  [/\bain't\b/gi, "am not"], [/\bcouldn't\b/gi, "could not"], [/\bshouldn't\b/gi, "should not"],
  [/\bwouldn't\b/gi, "would not"], [/\bmustn't\b/gi, "must not"], [/\bmightn't\b/gi, "might not"],
  [/\bisn't\b/gi, "is not"], [/\baren't\b/gi, "are not"], [/\bwasn't\b/gi, "was not"], [/\bweren't\b/gi, "were not"],
  [/\bhasn't\b/gi, "has not"], [/\bhaven't\b/gi, "have not"], [/\bhadn't\b/gi, "had not"],
  [/\bdon't\b/gi, "do not"], [/\bdoesn't\b/gi, "does not"], [/\bdidn't\b/gi, "did not"],
  [/\bi'm\b/gi, "i am"], [/\byou're\b/gi, "you are"], [/\bwe're\b/gi, "we are"], [/\bthey're\b/gi, "they are"],
  [/\bi've\b/gi, "i have"], [/\byou've\b/gi, "you have"], [/\bwe've\b/gi, "we have"], [/\bthey've\b/gi, "they have"],
  [/\bi'll\b/gi, "i will"], [/\byou'll\b/gi, "you will"], [/\bhe'll\b/gi, "he will"], [/\bshe'll\b/gi, "she will"],
  [/\bwe'll\b/gi, "we will"], [/\bthey'll\b/gi, "they will"], [/\bit'll\b/gi, "it will"],
  [/\bthat's\b/gi, "that is"], [/\bwhat's\b/gi, "what is"], [/\bthere's\b/gi, "there is"], [/\bhere's\b/gi, "here is"],
];
function expandContractions(text){
  let out = text;
  CONTRACTIONS.forEach(([re,rep])=>{ out = out.replace(re, rep); });
  return out;
}
/* If the next token is "not", skip it and return the index after it — lets every
   auxiliary+verb rule below recognise negative forms too (is not going, has not eaten...). */
function nextContentIndex(words, i){
  return (words[i+1]==="not") ? i+2 : i+1;
}

function analyzeLocally(sentence){
  const expanded = expandContractions(sentence.trim());
  const clean = expanded;
  const lower = clean.toLowerCase();
  const rawWords = clean.match(/[A-Za-z']+/g) || [];
  const words = rawWords.map(w=>w.toLowerCase());
  const n = words.length;
  const used = new Array(n).fill(false);
  const found = []; // {label, quote}
  const isProperNounAt = (i) => i>0 && i<n && /^[A-Z]/.test(rawWords[i]||"");

  const add = (label, quoteWords) => found.push({label, quote: quoteWords.filter(Boolean).join(" ")});

  // 1) going to future
  for(let i=0;i<n-2;i++){
    if(!used[i] && words[i]==="going" && words[i+1]==="to" && /^[a-z]+$/.test(words[i+2])){
      used[i]=used[i+1]=used[i+2]=true;
      add("زمان آینده (going to)", [words[i-1]||"", "going","to",words[i+2]]);
    }
  }
  // 2) be + (not) + V-ing  -> continuous (negation-aware)
  for(let i=0;i<n-1;i++){
    if(used[i]) continue;
    const j = nextContentIndex(words, i);
    if(!used[j] && BE.has(words[i]) && words[j] && words[j].endsWith("ing")){
      used[i]=true; if(j===i+2) used[i+1]=true; used[j]=true;
      const label = (words[i]==="am"||words[i]==="is"||words[i]==="are") ? "حال استمراری (Present Continuous)" : "گذشته استمراری (Past Continuous)";
      add(label, [words[i], j===i+2?"not":"", words[j]]);
    }
  }
  // 3) have + (not) + been + V-ing -> perfect continuous (negation-aware)
  for(let i=0;i<n-2;i++){
    if(used[i]) continue;
    const j = nextContentIndex(words, i);
    if(HAVE.has(words[i]) && words[j]==="been" && words[j+1] && words[j+1].endsWith("ing")){
      used[i]=true; if(j===i+2) used[i+1]=true; used[j]=true; used[j+1]=true;
      add("حال/گذشته کامل استمراری (Perfect Continuous)", [words[i], j===i+2?"not":"", "been", words[j+1]]);
    }
  }
  // 4) have/has/had + (not) + past participle -> perfect (negation-aware)
  for(let i=0;i<n-1;i++){
    if(used[i]) continue;
    const j = nextContentIndex(words, i);
    if(!used[j] && HAVE.has(words[i]) && words[j] && isPPForm(words[j]) && words[j]!=="been"){
      used[i]=true; if(j===i+2) used[i+1]=true; used[j]=true;
      const label = words[i]==="had" ? "گذشته کامل (Past Perfect)" : "حال کامل (Present Perfect)";
      add(label, [words[i], j===i+2?"not":"", words[j]]);
    }
  }
  // 5) be + (not) + past participle -> passive (negation-aware)
  for(let i=0;i<n-1;i++){
    if(used[i]) continue;
    const j = nextContentIndex(words, i);
    if(!used[j] && BE.has(words[i]) && words[j] && isPPForm(words[j])){
      used[i]=true; if(j===i+2) used[i+1]=true; used[j]=true;
      add("جمله مجهول (Passive Voice)", [words[i], j===i+2?"not":"", words[j]]);
    }
  }
  // 6) will -> future
  for(let i=0;i<n;i++){
    if(!used[i] && words[i]==="will"){
      used[i]=true;
      add("زمان آینده (will)", [words[i], words[i+1]||""]);
    }
  }
  // 7) other modals
  for(let i=0;i<n;i++){
    if(!used[i] && MODALS.has(words[i])){
      used[i]=true;
      add("فعل کمکی وجهی (Modal: " + words[i] + ")", [words[i], words[i+1]||""]);
    }
  }
  // "have to" / "has to" / "had to"
  for(let i=0;i<n-1;i++){
    if(!used[i] && !used[i+1] && HAVE.has(words[i]) && words[i+1]==="to"){
      used[i]=used[i+1]=true;
      add("فعل کمکی وجهی (have to)", [words[i], "to", words[i+2]||""]);
    }
  }
  // 8) standalone be forms -> present/past simple (verb "to be")
  for(let i=0;i<n;i++){
    if(!used[i] && BE.has(words[i]) && words[i]!=="be" && words[i]!=="been" && words[i]!=="being"){
      used[i]=true;
      const label = (words[i]==="am"||words[i]==="is"||words[i]==="are") ? "حال ساده (Present Simple - فعل to be)" : "گذشته ساده (Past Simple - فعل to be)";
      add(label, [words[i]]);
    }
  }
  // 9) past simple (regular -ed or irregular), not consumed
  for(let i=0;i<n;i++){
    if(!used[i] && isPastForm(words[i])){
      used[i]=true;
      add("گذشته ساده (Past Simple)", [words[i]]);
    }
  }
  // 10) do/does/did (+ not) -> present or past simple markers
  for(let i=0;i<n;i++){
    if(!used[i] && (words[i]==="do" || words[i]==="does")){
      used[i]=true;
      const j = nextContentIndex(words, i);
      if(j===i+2 && words[i+1]) used[i+1]=true;
      if(words[j]) used[j]=true;
      add("حال ساده (Present Simple)", [words[i], j===i+2?"not":"", words[j]||""]);
    } else if(!used[i] && words[i]==="did"){
      used[i]=true;
      const j = nextContentIndex(words, i);
      if(j===i+2 && words[i+1]) used[i+1]=true;
      if(words[j]) used[j]=true;
      add("گذشته ساده (Past Simple)", [words[i], j===i+2?"not":"", words[j]||""]);
    }
  }
  // 10b) present simple fallback — 3rd person singular verb ending in -s
  for(let i=0;i<n;i++){
    if(!used[i] && words[i].endsWith("s") && !words[i].endsWith("ss") && words[i].length>3
       && !BE.has(words[i]) && !HAVE.has(words[i]) && !MODALS.has(words[i])
       && !COMPARATIVES.has(words[i]) && !SUPERLATIVES.has(words[i])){
      const prev = words[i-1]||"";
      if(prev==="he" || prev==="she" || prev==="it" || isProperNounAt(i-1)){
        used[i]=true;
        add("حال ساده (Present Simple)", [prev, words[i]]);
      }
    }
  }
  // 10c) present simple fallback — base-form verb after I/you/we/they
  for(let i=1;i<n;i++){
    if(!used[i] && COMMON_VERBS.has(words[i])){
      const prev = words[i-1]||"";
      if(["i","you","we","they"].includes(prev)){
        used[i]=true;
        add("حال ساده (Present Simple)", [prev, words[i]]);
      }
    }
  }
  // 11) reported speech (reporting verb + no direct quotation marks)
  const reportVerbs = [" said"," told"," asked"," explained"," replied"," answered"," mentioned"," admitted"];
  if(reportVerbs.some(v=>lower.includes(v) || lower.startsWith(v.trim())) && !clean.includes('"') && !clean.includes("'")){
    add("نقل قول غیرمستقیم (Reported Speech)", ["said/told/asked", "..."]);
  }
  // 12) relative clauses
  for(let i=1;i<n;i++){
    if(!used[i] && ["who","which","whose","where"].includes(words[i])){
      used[i]=true;
      add("جمله موصولی (Relative Clause: " + words[i] + ")", [words[i-1], words[i]]);
    }
  }
  // 13) conditionals — split into if-clause / result-clause using the comma when present
  if(/\bif\b|\bunless\b/.test(lower)){
    let ifPart = lower, resultPart = lower;
    if(clean.includes(",")){
      const parts = lower.split(",");
      const idx = parts.findIndex(p=>/\bif\b|\bunless\b/.test(p));
      if(idx !== -1){ ifPart = parts[idx]; resultPart = parts.filter((_,i)=>i!==idx).join(" "); }
    }
    const ifTokens = (ifPart.match(/[a-z']+/g)||[]);
    const ifHasPast = ifTokens.some(w => isPastForm(w) && w!=="if");
    const ifHasHadPP = /\bhad\b/.test(ifPart) && ifTokens.some(w=>isPPForm(w) && w!=="had");
    const resultHasWouldHave = /would have\s+\w+/.test(resultPart);
    const resultHasWould = /\bwould\b/.test(resultPart) && !resultHasWouldHave;
    const resultHasWill = /\bwill\b/.test(resultPart);

    if(resultHasWouldHave && ifHasHadPP){
      add("شرطی نوع سوم (Third Conditional)", ["if", "...", "would have", "..."]);
    } else if(resultHasWould && (ifPart.includes(" were") || ifPart.includes(" was") || ifHasPast)){
      add("شرطی نوع دوم (Second Conditional)", ["if", "...", "would", "..."]);
    } else if(resultHasWill){
      add("شرطی نوع اول (First Conditional)", ["if", "...", "will", "..."]);
    } else {
      add("شرطی نوع صفر (Zero Conditional)", ["if", "..."]);
    }
  }
  // 14) articles
  const artCount = words.filter(w=>w==="a"||w==="an"||w==="the").length;
  if(artCount>0){
    add("حروف تعریف (Articles: a/an/the)", ["×" + artCount]);
  }
  // 15) prepositions of time/place
  for(let i=0;i<n-1;i++){
    if(["at","on","in"].includes(words[i])){
      const next = words[i+1];
      if(TIME_WORDS.has(next) || /^\d{3,4}$/.test(next) || (next==="the" && TIME_WORDS.has(words[i+2]))){
        add("حرف اضافه‌ی زمان (" + words[i] + ")", [words[i], next]);
      } else {
        add("حرف اضافه‌ی مکان (" + words[i] + ")", [words[i], next]);
      }
    }
  }
  // 16) comparatives / superlatives (with stoplists to avoid false positives)
  for(let i=0;i<n;i++){
    const w = words[i];
    if(COMPARATIVES.has(w) || (w.endsWith("er") && w.length>4 && !BE.has(w) && !NON_ADJ_ER.has(w))){
      add("صفت تفضیلی (Comparative)", [w]);
    }
    if(SUPERLATIVES.has(w) || (w.endsWith("est") && w.length>5 && !NON_ADJ_EST.has(w))){
      add("صفت عالی (Superlative)", [w]);
    }
    if(w==="more" && words[i+1] && !HAVE.has(words[i+1]) && !BE.has(words[i+1])){
      add("صفت تفضیلی (more + adj)", [w, words[i+1]]);
    }
    if(w==="most" && words[i+1]){
      add("صفت عالی (most + adj)", [w, words[i+1]]);
    }
  }
  // 17) gerunds (gerund used as noun/object) and infinitives (restricted to common verbs to cut false positives)
  for(let i=0;i<n;i++){
    if(!used[i] && words[i].endsWith("ing") && words[i].length>4){
      const prev = words[i-1]||"";
      if(GERUND_TRIGGERS.has(prev) || i===0){
        add("اسم مصدر (Gerund: " + words[i] + ")", [prev, words[i]]);
      }
    }
    if(words[i]==="to" && words[i+1] && words[i-1]!=="going" && COMMON_VERBS.has(words[i+1])){
      add("مصدر با to (Infinitive: to " + words[i+1] + ")", ["to", words[i+1]]);
    }
  }

  // de-duplicate identical labels
  const seen = new Set();
  const unique = found.filter(f=>{
    const key = f.label;
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
  return unique;
}

/* ============ ANALYZER VIEW ============ */
function renderAnalyzer(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <button class="mobile-back" id="mobile-back-btn">→ بازگشت</button>
    <div class="analyzer-wrap">
      <h2>تحلیلگر گرامر جمله</h2>
      <p class="hint">هر جمله‌ی انگلیسی بنویس تا گرامرهای استفاده‌شده توش رو برات فهرست کنم. این تحلیل بر اساس یک موتور قاعده‌محور ساده کار می‌کنه (بدون هوش مصنوعی)، پس ممکنه جمله‌های پیچیده یا غیرمعمول رو کامل تشخیص نده.</p>
      <textarea id="analyzer-input" rows="3" placeholder="Type any English sentence here..."></textarea>
      <div class="row-btn"><button class="primary" id="analyze-btn">تحلیل کن</button></div>
      <div class="result-box" id="analyzer-result"></div>
    </div>
  `;
  document.getElementById("mobile-back-btn").addEventListener("click", ()=>{
    setTab("topics");
    renderAll();
  });
  document.getElementById("analyze-btn").addEventListener("click", ()=>{
    const val = document.getElementById("analyzer-input").value.trim();
    const box = document.getElementById("analyzer-result");
    if(!val){
      box.className = "result-box show bad";
      box.textContent = "اول یه جمله بنویس.";
      return;
    }
    const results = analyzeLocally(val);
    box.className = "result-box show neutral";
    if(results.length===0){
      box.textContent = "هیچ ساختار گرامری مشخصی در این جمله پیدا نشد. جمله‌ی دیگه‌ای امتحان کن.";
    } else {
      box.textContent = results.map(r => "• " + r.label + "   →   «" + r.quote + "»").join("\n");
    }
  });
}

/* ============ LEARNING PATH VIEW ============ */
function renderPath(){
  const main = document.getElementById("main");
  const total = totalTopicCount();
  const doneCount = completedTopics.size;
  const pct = total ? Math.round((doneCount/total)*100) : 0;
  let stepCounter = 0;

  const levelsHtml = LEARNING_PATH.map(lv=>{
    const topics = lv.ids.map(id=>findTopic(id)).filter(Boolean);
    const doneInLevel = topics.filter(t=>completedTopics.has(t.id)).length;
    const allDone = topics.length>0 && doneInLevel === topics.length;
    const cardsHtml = topics.map(t=>{
      stepCounter++;
      const done = completedTopics.has(t.id);
      return `
        <div class="path-card${done?' done':''}" data-id="${t.id}">
          <span class="check-icon">✓</span>
          <div class="step-no">مرحله ${stepCounter}</div>
          <span class="en">${t.en}</span>
          <div class="fa">${t.fa}</div>
        </div>`;
    }).join("");
    return `
      <div class="level-block${allDone?' all-done':''}">
        <div class="level-block-head">
          <span class="level-badge">${lv.level}</span>
          <h3>${lv.label}</h3>
          <span class="mini-progress">${doneInLevel}/${topics.length}</span>
        </div>
        <div class="path-grid">${cardsHtml}</div>
        <div class="level-complete-banner">🎉 آفرین! تمام گرامرهای سطح ${lv.level} رو یاد گرفتی.</div>
      </div>`;
  }).join("");

  main.innerHTML = `
    <button class="mobile-back" id="mobile-back-btn">→ بازگشت</button>
    <div class="path-wrap">
      <h2>مسیر یادگیری گرامر</h2>
      <p class="hint">این مسیر، گرامرها رو به همون ترتیبی که معمولاً توی کتاب‌های آموزشی تدریس می‌شن مرتب کرده — از پایه تا پیشرفته. روی هر کارت بزن تا بری توی همون درس، و بعد از یادگیری دکمه‌ی «یاد گرفتم» رو بزن تا پیشرفتت ثبت بشه.</p>

      <div class="overall-progress">
        <div class="row"><strong>پیشرفت کلی</strong><span>${doneCount} / ${total} — ${pct}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>

      ${levelsHtml}
    </div>
  `;

  document.getElementById("mobile-back-btn").addEventListener("click", ()=>{
    setTab("topics");
    renderAll();
  });
  main.querySelectorAll(".path-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      currentTopicId = card.dataset.id;
      setTab("topics");
      renderAll();
    });
  });
}

/* ============ TAB CONTROL ============ */
function setTab(tab){
  currentTab = tab;
  document.getElementById("tab-topics").classList.toggle("active", tab==="topics");
  document.getElementById("tab-path").classList.toggle("active", tab==="path");
  document.getElementById("tab-analyzer").classList.toggle("active", tab==="analyzer");
}
document.getElementById("tab-topics").addEventListener("click", ()=>{ setTab("topics"); renderAll(); });
document.getElementById("tab-path").addEventListener("click", ()=>{ setTab("path"); renderAll(); });
document.getElementById("tab-analyzer").addEventListener("click", ()=>{ setTab("analyzer"); renderAll(); });

function renderAll(){
  if(currentTab === "topics") renderTopic();
  else if(currentTab === "path") renderPath();
  else renderAnalyzer();
  updateMobileBodyClass();
}

function updateMobileBodyClass(){
  const isMobile = window.matchMedia("(max-width: 860px)").matches;
  const showingDetail = isMobile && (currentTab === "analyzer" || currentTab === "path" || (currentTab === "topics" && !!currentTopicId));
  document.body.classList.toggle("mobile-detail", showingDetail);
  if(showingDetail) window.scrollTo(0,0);
}
window.addEventListener("resize", updateMobileBodyClass);

/* ============ INIT ============ */
renderSidebar();
renderAll();
</script>
</body>
</html>
